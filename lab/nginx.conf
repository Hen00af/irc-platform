# ============================================================
# Default virtual server
# ============================================================
server {
    # 接続を待ち受けるポート
    listen 8080;

    # Host ヘッダーによって選択される仮想サーバー名
    server_name localhost;

    # リクエストボディの最大サイズ
    # 超過した場合は 413 Payload Too Large
    client_max_body_size 1048576;

    # デフォルトのエラーページ
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;

    # --------------------------------------------------------
    # Static files
    #
    # GET /
    # GET /index.html
    # GET /images/cat.jpg
    # --------------------------------------------------------
    location / {
        root /workspace/www;
        index index.html;

        allowed_methods GET;
        autoindex off;
    }

    # --------------------------------------------------------
    # Directory listing
    #
    # GET /public/
    #
    # index.html が存在しない場合に、ディレクトリ内の
    # ファイル一覧を HTML として返す
    # --------------------------------------------------------
    location /public/ {
        root /workspace/www;
        allowed_methods GET;

        autoindex on;
    }

    # --------------------------------------------------------
    # Custom error-page files
    #
    # 内部リダイレクト後に読むための location
    # --------------------------------------------------------
    location /errors/ {
        root /workspace/www;
        allowed_methods GET;

        autoindex off;
    }

    # --------------------------------------------------------
    # Method restriction
    #
    # GET は成功
    # POST と DELETE は 405 Method Not Allowed
    # --------------------------------------------------------
    location /readonly/ {
        root /workspace/www;
        index index.html;

        allowed_methods GET;
        autoindex off;
    }

    # --------------------------------------------------------
    # File upload
    #
    # POST /upload/
    # DELETE /upload/example.txt
    # GET /upload/example.txt
    #
    # POST のリクエストボディを指定ディレクトリへ保存する
    # --------------------------------------------------------
    location /upload/ {
        root /workspace/www;

        allowed_methods GET POST DELETE;
        upload_path /workspace/www/upload;

        autoindex on;
    }

    # --------------------------------------------------------
    # DELETE test
    #
    # DELETE /delete/sample.txt
    # --------------------------------------------------------
    location /delete/ {
        root /workspace/www;

        allowed_methods GET DELETE;
        autoindex on;
    }

    # --------------------------------------------------------
    # HTTP redirect
    #
    # GET /old-page
    # -> 301 Location: /new-page
    # --------------------------------------------------------
    location /old-page {
        return 301 /new-page;
    }

    location /new-page {
        root /workspace/www;
        index new-page.html;

        allowed_methods GET;
    }

    # --------------------------------------------------------
    # CGI
    #
    # GET  /cgi-bin/hello.py?name=seiya
    # POST /cgi-bin/echo.py
    #
    # .py ファイルの場合は Python CGI として実行する
    # --------------------------------------------------------
    location /cgi-bin/ {
        root /workspace/www;

        allowed_methods GET POST;
        cgi_extension .py;
        cgi_path /usr/bin/python3;
    }
}

# ============================================================
# Virtual server test
#
# 同じポートでも Host ヘッダーが異なれば別サイトになる
# ============================================================
server {
    listen 8080;
    server_name admin.localhost;

    client_max_body_size 1048576;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root /workspace/admin;
        index index.html;

        allowed_methods GET;
        autoindex off;
    }
}

# ============================================================
# Multiple listening ports test
# ============================================================
server {
    listen 8081;
    server_name localhost;

    client_max_body_size 128;

    error_page 404 /errors/404.html;
    error_page 413 /errors/413.html;

    location / {
        root /workspace/small-body-site;
        index index.html;

        allowed_methods GET POST;
    }
}