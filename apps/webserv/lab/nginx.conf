# ============================================================
# Default virtual server
#
# 注意: これは「本物の nginx を参照として動かす」ための設定です。
# 自作 Webserv 独自ディレクティブ (allowed_methods / upload_path /
# cgi_extension / cgi_path) は本物の nginx には存在しないため、
# 標準ディレクティブに翻訳しています。挙動差はコメントで明記します。
# ============================================================
server {
    # 接続を待ち受けるポート
    listen 8080;

    # Host ヘッダーによって選択される仮想サーバー名
    server_name localhost;

    # リクエストボディの最大サイズ
    # 超過した場合は 413 Payload Too Large
    client_max_body_size 1048576;

    # デフォルトのエラーページ
    error_page 400 /errors/400.html;
    error_page 403 /errors/403.html;
    error_page 404 /errors/404.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;

    # --------------------------------------------------------
    # Static files
    #
    # GET /
    # GET /index.html
    # GET /images/cat.jpg
    #
    # ※ Webserv は許可外メソッドに 405 を返すが、nginx の
    #    limit_except は 403 を返す点が異なる。
    # --------------------------------------------------------
    location / {
        root /workspace/www;
        index index.html;

        limit_except GET { deny all; }
        autoindex off;
    }

    # --------------------------------------------------------
    # Directory listing
    #
    # GET /public/
    #
    # index.html が存在しない場合に、ディレクトリ内の
    # ファイル一覧を HTML として返す
    # --------------------------------------------------------
    location /public/ {
        root /workspace/www;

        limit_except GET { deny all; }
        autoindex on;
    }

    # --------------------------------------------------------
    # Custom error-page files
    #
    # 内部リダイレクト後に読むための location
    # --------------------------------------------------------
    location /errors/ {
        root /workspace/www;

        limit_except GET { deny all; }
        autoindex off;
    }

    # --------------------------------------------------------
    # Method restriction
    #
    # GET は成功
    # POST と DELETE は拒否 (nginx は 403)
    # --------------------------------------------------------
    location /readonly/ {
        root /workspace/www;
        index index.html;

        limit_except GET { deny all; }
        autoindex off;
    }

    # --------------------------------------------------------
    # File upload
    #
    # ※ nginx には POST でファイル保存する機能がないため、
    #    WebDAV モジュール (PUT/DELETE) で代替している。
    #    自作 Webserv は POST、nginx は PUT を使う点が異なる。
    #
    #    PUT    /upload/example.txt   (本文をファイルとして保存)
    #    DELETE /upload/example.txt
    #    GET    /upload/              (一覧)
    # --------------------------------------------------------
    location /upload/ {
        root /workspace/www;

        dav_methods PUT DELETE;
        create_full_put_path on;
        limit_except GET PUT DELETE { deny all; }

        autoindex on;
    }

    # --------------------------------------------------------
    # DELETE test
    #
    # DELETE /delete/sample.txt
    # --------------------------------------------------------
    location /delete/ {
        root /workspace/www;

        dav_methods DELETE;
        limit_except GET DELETE { deny all; }

        autoindex on;
    }

    # --------------------------------------------------------
    # HTTP redirect
    #
    # GET /old-page
    # -> 301 Location: /new-page
    # --------------------------------------------------------
    location /old-page {
        return 301 /new-page;
    }

    location /new-page {
        root /workspace/www;
        index new-page.html;

        limit_except GET { deny all; }
    }

    # --------------------------------------------------------
    # CGI
    #
    # GET  /cgi-bin/hello.py?name=seiya
    # POST /cgi-bin/echo.py
    #
    # ※ 本物の nginx に CGI 実行機能はないため、fcgiwrap を
    #    FastCGI ブリッジとして使い .py を CGI 実行している
    #    (Dockerfile で fcgiwrap/python3 を導入、
    #     40-spawn-fcgiwrap.sh で起動)。
    #    .py には実行権限と #!/usr/bin/python3 のシェバンが必要。
    # --------------------------------------------------------
    location /cgi-bin/ {
        root /workspace/www;

        limit_except GET POST { deny all; }

        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $document_root;
    }
}

# ============================================================
# Virtual server test
#
# 同じポートでも Host ヘッダーが異なれば別サイトになる
# ============================================================
server {
    listen 8080;
    server_name admin.localhost;

    client_max_body_size 1048576;

    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    location / {
        root /workspace/admin;
        index index.html;

        limit_except GET { deny all; }
        autoindex off;
    }
}

# ============================================================
# Multiple listening ports test
# ============================================================
server {
    listen 8081;
    server_name localhost;

    client_max_body_size 128;

    error_page 404 /errors/404.html;
    error_page 413 /errors/413.html;

    location / {
        root /workspace/small-body-site;
        index index.html;

        limit_except GET POST { deny all; }
    }
}
