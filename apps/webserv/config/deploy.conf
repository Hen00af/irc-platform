# Deployment configuration for CPU-constrained hosts.
#
# Differs from default.conf in two ways.
#
# cgi_timeout: every CGI request forks an interpreter, and on a throttled
# instance (Render's free plan gives 0.1 CPU) python3 and php-cgi need seconds
# just to start, so the 3 second timeout in default.conf returns 504 for
# scripts that finish instantly on a normal host. default.conf keeps 3 seconds
# because the CGI integration test relies on it: slow.py?seconds=2 must succeed
# and slow.py?seconds=5 must time out.
#
# Methods: this file serves an origin anyone on the internet can reach, and the
# server has no notion of a user, so it has no way to tell an owner from a
# stranger. POST and DELETE therefore stay out of it — an unauthenticated
# upload is a stranger's file served from this origin, and an unauthenticated
# DELETE is a stranger deleting someone else's. default.conf keeps both so the
# upload and delete paths are still demonstrable locally and under test.
server {
    listen 0.0.0.0:8080;
    root www;
    index index.html;
    client_max_body_size 10485760;
    autoindex off;
    allow_methods GET;
    error_page 404 www/errors/404.html;

    location /files {
        root www/files;
        index index.html;
        autoindex on;
        allow_methods GET;
    }

    # upload_dir stays set with GET only: it marks this location as holding
    # client-written files, which is what makes the static handler return them
    # as attachments rather than by extension.
    location /upload {
        root www/uploads;
        index index.html;
        autoindex off;
        allow_methods GET;
        upload_dir www/uploads;
    }

    location /health {
        root www/health;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /admin {
        root www/admin;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /chat {
        root www/chat;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /cgi-bin {
        root www/cgi-bin;
        allow_methods GET POST;
        cgi_handler .py /usr/bin/python3;
        cgi_handler .php /usr/bin/php-cgi;
        cgi_timeout 15;
    }
}
