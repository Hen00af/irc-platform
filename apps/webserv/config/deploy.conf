# Deployment configuration for CPU-constrained hosts.
#
# Identical to default.conf except for cgi_timeout. Every CGI request forks an
# interpreter, and on a throttled instance (Render's free plan gives 0.1 CPU)
# python3 and php-cgi need seconds just to start, so the 3 second timeout in
# default.conf returns 504 for scripts that finish instantly on a normal host.
#
# default.conf keeps 3 seconds because the CGI integration test relies on it:
# slow.py?seconds=2 must succeed and slow.py?seconds=5 must time out.
server {
    listen 0.0.0.0:8080;
    root www;
    index index.html;
    client_max_body_size 10485760;
    autoindex off;
    allow_methods GET;
    error_page 404 www/errors/404.html;

    location /files {
        root www/files;
        index index.html;
        autoindex on;
        allow_methods GET DELETE;
    }

    location /upload {
        root www/uploads;
        index index.html;
        autoindex on;
        allow_methods GET POST DELETE;
        upload_dir www/uploads;
    }

    location /health {
        root www/health;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /admin {
        root www/admin;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /chat {
        root www/chat;
        index index.html;
        autoindex off;
        allow_methods GET;
    }

    location /cgi-bin {
        root www/cgi-bin;
        allow_methods GET POST;
        cgi_handler .py /usr/bin/python3;
        cgi_handler .php /usr/bin/php-cgi;
        cgi_timeout 15;
    }
}
