# Render Blueprint.
#
# Render publishes one HTTPS port per service, so the container runs the edge
# proxy (deploy/edge.js) in front of Webserv and the gateway. Render does not
# expose extra TCP ports, so native IRC clients cannot reach 6667 here; IRC
# stays reachable inside the container for the gateway only.
services:
  - type: web
    name: irc-platform
    runtime: docker
    # "free" spins the instance down when idle, which clears the in-memory IRC
    # state and channel history. Use "starter" to keep it running.
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: EDGE_PROXY
        value: "on"
      # 0.1 CPU on the free plan makes CGI interpreter startup exceed the
      # 3 second timeout in default.conf.
      - key: WEBSERV_CONFIG
        value: config/deploy.conf
      - key: IRC_HOST
        value: 127.0.0.1
      - key: IRC_PORT
        value: "6667"
      - key: WS_PORT
        value: "3001"
      # Only used between the gateway and ft_irc inside the container.
      - key: IRC_PASSWORD
        generateValue: true
      # Must match the deployed URL. An empty value disables the gateway's
      # Origin check and lets any site open a WebSocket to it.
      - key: ALLOWED_ORIGINS
        value: https://irc-platform.onrender.com
      - key: HISTORY_LIMIT
        value: "100"
      - key: HISTORY_REPLAY_LIMIT
        value: "50"
