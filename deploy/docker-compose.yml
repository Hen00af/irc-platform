services:
  relay:
    build:
      context: ..
    environment:
      IRC_PASSWORD: ${IRC_PASSWORD:-local-development-only}
      IRC_HOST: 127.0.0.1
      IRC_PORT: 6667
      WS_PORT: 3001
      ALLOWED_ORIGINS: http://localhost:8080
    ports:
      - "8080:8080"
      - "3001:3001"
      - "6667:6667"
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - uploads:/app/webserv/www/uploads

volumes:
  uploads:
